<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수강료 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ink:#1E2129;
  --ink-dark:#1E2129;
  --ink-soft:#5B5F6B;
  --paper:#FBF9F4;
  --panel:#FFFFFF;
  --line:#E4DFD3;
  --brass:#A9793B;
  --brass-bg:#F3E9D8;
  --danger:#B23B3B;
  --danger-bg:#FBEAEA;
  --ok:#4B6B45;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;}
.serif{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;}
.wrap{max-width:980px;margin:0 auto;padding:116px 24px 80px;}
.brand-logo{position:absolute;top:16px;left:50%;transform:translateX(-50%);height:88px;width:auto;border-radius:4px;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,0.15);}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 20px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;font-size:20px;font-weight:600;}
.topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.mode-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.print-btn-wrap{position:relative;}
.print-warning{display:none;position:absolute;top:100%;right:0;margin-top:5px;font-size:11px;color:var(--danger);white-space:nowrap;}
.print-warning.show{display:block;}

button{font-family:inherit;cursor:pointer;border:none;font-size:13.5px;}
.btn{padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:all .15s ease;}
.btn:hover{border-color:var(--brass);color:var(--brass);}
.btn-accent{background:var(--ink-dark);color:#fff;border-color:var(--ink-dark);}
.btn-accent:hover{background:#3A3950;color:#fff;}
.btn-accent.on{background:var(--brass);border-color:var(--brass);}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:5px;}

.status-line{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);margin-bottom:22px;flex-wrap:wrap;}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
.status-dot.saving{background:var(--brass);}
.author-input{border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-size:12.5px;font-family:inherit;width:120px;background:var(--panel);}

.tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.tab-btn{padding:9px 18px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-weight:500;}
.tab-btn.active{background:var(--ink-dark);color:#fff;border-color:var(--ink-dark);}

.cat-panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 26px 22px;margin-bottom:18px;}
.cat-panel.active{display:block;}
.cat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.cat-head h2{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;font-size:18px;}

table.fee{width:100%;border-collapse:collapse;}
table.fee th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding:0 8px 10px;border-bottom:1px solid var(--line);}
table.fee th:last-child, table.fee td:last-child{text-align:right;}
table.fee td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
table.fee tr:last-child td{border-bottom:none;}

.cell-input{width:100%;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:5px;font-family:inherit;font-size:14px;color:var(--ink);}
.cell-input:hover{border-color:var(--line);}
.cell-input:focus{outline:none;border-color:var(--brass);background:#fff;color:#1E2129;}
.price-input{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass);}
.col-level{width:20%;}
.col-desc{width:34%;}
.col-time{width:22%;}
.col-price{width:20%;}
.col-del{width:56px;}

.del-btn{width:26px;height:26px;border-radius:50%;background:transparent;color:var(--ink-soft);font-size:14px;display:flex;align-items:center;justify-content:center;}
.del-btn:hover{background:var(--danger-bg);color:var(--danger);}
.lock-row-btn{width:26px;height:26px;border-radius:50%;background:transparent;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.lock-row-btn:hover{background:var(--brass-bg);color:var(--brass);}
.unlock-row-btn{background:transparent;border:none;font-size:14px;cursor:pointer;padding:2px 6px;border-radius:5px;}
.unlock-row-btn:hover{background:var(--brass-bg);}

.add-row-btn{margin-top:14px;font-size:13px;color:var(--brass);background:var(--brass-bg);padding:8px 14px;border-radius:6px;border:1px dashed var(--brass);}
.add-row-btn:hover{opacity:.85;}

.view-name{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;font-weight:600;font-size:15.5px;}
.locked-row{background:rgba(0,0,0,0.02);}
.locked-row .view-name{font-weight:500;color:var(--ink-soft);}
.drag-handle{cursor:grab;margin-right:8px;color:var(--ink-soft);user-select:none;display:inline-block;}
.drag-handle:active{cursor:grabbing;}
.level-cell{display:flex;align-items:center;}
table.fee tbody tr.drag-over{background:var(--brass-bg);outline:1px dashed var(--brass);}
.view-desc,.view-time{color:var(--ink-soft);font-size:13px;}
.view-price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass);font-size:15px;}
.view-price small{font-weight:400;font-size:11.5px;color:var(--ink-soft);margin-left:2px;}

.calc-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px 26px 24px;margin-bottom:18px;}
.calc-card h2{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;font-size:18px;margin-bottom:6px;}
.calc-card-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}

.course-picker{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.course-picker select{flex:1;min-width:220px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:#1E2129;}

.selected-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.selected-empty{font-size:13px;color:var(--ink-soft);padding:10px 0;}
.selected-item{display:flex;align-items:center;justify-content:space-between;background:var(--brass-bg);border-radius:6px;padding:9px 12px;font-size:13.5px;}
.selected-item .info b{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;}
.selected-item .info span{color:var(--ink-soft);font-size:12px;margin-left:8px;}
.selected-item .price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass);margin-right:0;}
.price-strike{font-weight:400;color:var(--ink-soft);text-decoration:line-through;margin-right:2px;}
.month-tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--brass);background:var(--brass-bg);padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:middle;}
.qty-control{display:flex;align-items:center;gap:6px;}
.qty-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:#fff;color:#1E2129;display:flex;align-items:center;justify-content:center;font-size:13px;}
.qty-btn:hover{border-color:var(--brass);color:var(--brass);}
.qty-num{font-size:13px;min-width:16px;text-align:center;font-variant-numeric:tabular-nums;}
.view-only-qty{display:none;color:var(--ink-soft);}
.view-mode .view-only-qty{display:inline;}
.selected-item .remove-btn{width:22px;height:22px;border-radius:50%;background:transparent;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:13px;}
.selected-item .remove-btn:hover{background:var(--danger-bg);color:var(--danger);}

.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.calc-grid label{font-size:11.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;}
.calc-grid input{border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:#1E2129;}
.calc-grid input[readonly]{background:var(--brass-bg);color:var(--brass);font-weight:600;}
.discount-grid{grid-template-columns:2fr 1fr 1fr;}
.discount-grid label.wide{grid-column:span 1;}
.student-name-field{margin-bottom:16px;}
.student-name-field label{font-size:11.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;max-width:280px;}
.student-name-field input{border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-family:inherit;font-size:13.5px;background:#fff;color:#1E2129;}
.print-save-hint{margin-top:16px;font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;}
.record-item{display:flex;align-items:center;justify-content:space-between;background:var(--brass-bg);border-radius:6px;padding:9px 12px;font-size:13.5px;margin-bottom:8px;}
.record-item .info b{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;}
.record-item .info span{color:var(--ink-soft);font-size:12px;margin-left:8px;}
.record-item .price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--brass);}

.calc-summary{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;}
.calc-summary .stat{flex:1;min-width:130px;padding:0 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;}
.calc-summary .stat:first-child{border-left:none;padding-left:0;}
.calc-summary .stat span{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;min-height:28px;line-height:14px;}
.calc-summary .stat strong{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);line-height:22px;}
.calc-summary .stat strong.neg{color:var(--danger);}
.calc-summary .stat.highlight strong{color:var(--brass);font-size:18px;line-height:22px;}

.calc-breakdown{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.calc-breakdown-title{font-size:12px;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
.breakdown-rate-note{text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--ink-soft);}
.breakdown-single{display:flex;gap:0;background:var(--brass-bg);border-radius:8px;padding:14px 18px;}
.breakdown-item{flex:1;padding:0 14px;border-left:1px solid rgba(169,121,59,.25);}
.breakdown-item #breakdown-unlock-btn{margin-top:2px;padding:4px 10px;font-size:12px;}
.breakdown-item:first-child{border-left:none;padding-left:0;}
.breakdown-item span{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
.breakdown-item strong{font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink);}
.breakdown-item.highlight strong{color:var(--brass);font-size:19px;}
.breakdown-item.highlight strong.pct-high{color:var(--danger);}
.breakdown-item.highlight strong.pct-low{color:var(--ok);}

.edit-only{}
.view-mode .edit-only{display:none !important;}

.note-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px;font-size:13px;color:var(--ink-soft);}
.note-box textarea{width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink-soft);resize:none;min-height:60px;padding:0;overflow:hidden;}
.note-box textarea:focus{outline:none;}
.notes-display{display:none;}
.view-mode .notes-display{display:block;}
.note-heading{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:14px;}
.note-heading:first-child{margin-top:0;}
.note-body{font-size:11.5px;color:var(--ink-soft);margin:3px 0 3px 2px;line-height:1.65;}
.note-spacer{height:4px;}

.print-header{display:none;}

@media print{
  body{
    --ink:#1E2129;
    --ink-dark:#1E2129;
    --ink-soft:#5B5F6B;
    --paper:#ffffff;
    --panel:#ffffff;
    --line:#E4DFD3;
    --brass:#A9793B;
    --brass-bg:#F3E9D8;
    --danger:#B23B3B;
    --danger-bg:#FBEAEA;
    --ok:#4B6B45;
    background:#fff;
  }
  .topbar, .mode-controls, .status-line, .tabs .tab-btn, .add-row-btn, .del-btn, .author-input, .edit-only{display:none !important;}
  .tabs{display:none;}
  .cat-panel{display:none !important;}
  .calc-card{border:none;padding:0;page-break-inside:avoid;}
  .print-header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px;}
  .print-header h1{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;font-size:22px;margin:14px 0 4px;}
  .print-header p{font-size:12px;color:var(--ink-soft);}
  .print-header-text{display:none;}
  .print-logo{height:116px;width:auto;}
  .wrap{padding:0;max-width:100%;position:relative;z-index:1;}
  .notes-display{display:block !important;}
  .brand-logo{display:none !important;}
}

body.force-print-view{
  --ink:#1E2129;
  --ink-dark:#1E2129;
  --ink-soft:#5B5F6B;
  --paper:#ffffff;
  --panel:#ffffff;
  --line:#E4DFD3;
  --brass:#A9793B;
  --brass-bg:#F3E9D8;
  --danger:#B23B3B;
  --danger-bg:#FBEAEA;
  --ok:#4B6B45;
  background:#fff;
}
body.force-print-view .topbar,
body.force-print-view .mode-controls,
body.force-print-view .status-line,
body.force-print-view .tabs,
body.force-print-view .add-row-btn,
body.force-print-view .del-btn,
body.force-print-view .author-input,
body.force-print-view .edit-only{display:none !important;}
body.force-print-view .cat-panel{display:none !important;}
body.force-print-view .calc-card{border:none;padding:0;}
body.force-print-view .print-header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:28px;}
body.force-print-view .print-header h1{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Pretendard',sans-serif;font-size:22px;margin:14px 0 4px;}
body.force-print-view .print-header p{font-size:12px;color:var(--ink-soft);}
body.force-print-view .print-header-text{display:none;}
body.force-print-view .print-logo{height:116px;width:auto;}
body.force-print-view .wrap{padding:32px;max-width:700px;position:relative;z-index:1;background:#fff;}
body.force-print-view .notes-display{display:block !important;}
body.force-print-view .brand-logo{display:none !important;}

@media (max-width:640px){
  .wrap{padding-top:76px;}
  .brand-logo{height:46px;top:14px;left:50%;transform:translateX(-50%);}
  .topbar{flex-direction:column;align-items:flex-start;}
  table.fee, table.fee thead, table.fee tbody, table.fee th, table.fee td, table.fee tr{display:block;}
  table.fee thead{display:none;}
  table.fee tr{border-bottom:1px solid var(--line);padding:12px 0;}
  table.fee td{border-bottom:none;padding:4px 0;}
  table.fee td:last-child{text-align:left;}
  .calc-grid{grid-template-columns:1fr;}
  .calc-summary .stat{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:10px;margin-top:10px;}
  .calc-summary .stat:first-child{border-top:none;margin-top:0;padding-top:0;}
}
</style>
</head>

      { id: cid(), level: '피아노레슨(입시)', desc: '입시 대비 피아노 레슨', time: '주2회 60분', price: '420000', locked: true },
      { id: cid(), level: '피아노레슨', desc: '취미·기초 피아노 레슨', time: '주2회 60분', price: '350000', locked: true }
    ]}
  ],
  calculator: { items: [], discountLabel: '', discountAmount: '', discountLabel2: '', discountAmount2: '' }
};

let state = null;
let editMode = true;
let saveTimer = null;
let dragSource = null;

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const authorInput = document.getElementById('author-input');
const notesInput = document.getElementById('notes-input');
const modeToggle = document.getElementById('mode-toggle');
const appWrap = document.getElementById('app-wrap');
const courseSelect = document.getElementById('course-select');
const selectedListEl = document.getElementById('selected-list');

function setStatus(text, saving){
  statusText.textContent = text;
  statusDot.classList.toggle('saving', !!saving);
}

async function loadData(){
  setStatus('불러오는 중…', true);
  try{
    const snap = await docRef.get();
    if(snap.exists){
      state = snap.data();
      state.categories.forEach(cat => cat.rows.forEach(r => {
        if(!r.id) r.id = cid();
        if(r.locked === undefined) r.locked = true;
      }));
      if(!state.calculator) state.calculator = { items: [], discountLabel: '', discountAmount: '', discountLabel2: '', discountAmount2: '' };
      if(state.calculator.discountLabel2 === undefined) state.calculator.discountLabel2 = '';
      if(state.calculator.discountAmount2 === undefined) state.calculator.discountAmount2 = '';
      if(!state.calculator.items){
        const legacyIds = state.calculator.courseIds || [];
        state.calculator.items = legacyIds.map(courseId => ({ instanceId: cid(), courseId }));
        delete state.calculator.courseIds;
      }
      const expanded = [];
      state.calculator.items.forEach(item => {
        const qty = item.qty || 1;
        for(let i = 0; i < qty; i++) expanded.push({ instanceId: i === 0 ? item.instanceId : cid(), courseId: item.courseId });
      });
      state.calculator.items = expanded;
    }else{
      state = DEFAULT_DATA;
      await persist(false);
    }
  }catch(e){
    console.error(e);
    state = state || DEFAULT_DATA;
    setStatus('불러오기 실패 — Firebase 설정을 확인해주세요', false);
    render();
    return;
  }
  authorInput.value = state.updatedBy || '';
  notesInput.value = state.notes || '';
  autoResizeTextarea(notesInput);
  renderNotesDisplay();
  document.getElementById('calc-discount-label').value = state.calculator.discountLabel || '';
  document.getElementById('calc-discount-amount').value = state.calculator.discountAmount || '';
  document.getElementById('calc-discount-label2').value = state.calculator.discountLabel2 || '';
  document.getElementById('calc-discount-amount2').value = state.calculator.discountAmount2 || '';
  render();
  updateStatusFromState();
}

async function persist(showSaving = true){
  if(showSaving) setStatus('저장 중…', true);
  state.updatedAt = new Date().toISOString();
  try{
    await docRef.set(state);
    updateStatusFromState();
  }catch(e){
    console.error(e);
    setStatus('저장 실패 — Firebase 설정 또는 네트워크를 확인해주세요', false);
  }
}

function updateStatusFromState(){
  if(!state.updatedAt){ setStatus('저장된 데이터 없음'); return; }
  const d = new Date(state.updatedAt);
  const t = d.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
  const who = state.updatedBy ? ` · ${state.updatedBy}님이 수정` : '';
  setStatus(`최근 저장: ${t}${who}`);
}

function scheduleSave(){
  setStatus('저장 중…', true);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => persist(true), 500);
}

function formatPrice(v){
  const n = parseInt(String(v).replace(/[^0-9]/g,''), 10);
  if(isNaN(n)) return '';
  return n.toLocaleString('ko-KR');
}

function findRowById(id){
  for(const cat of state.categories){
    const row = cat.rows.find(r => r.id === id);
    if(row) return { row, cat };
  }
  return null;
}

function render(){
  appWrap.classList.toggle('view-mode', !editMode);
  renderCatalog();
  renderCourseOptions();
  renderCalculator();
}

function renderCatalog(){
  tabsEl.innerHTML = '';
  panelsEl.innerHTML = '';

  state.categories.forEach((cat, idx) => {
    const tab = document.createElement('button');
    tab.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    tab.textContent = cat.name;
    tab.dataset.cat = cat.id;
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.cat-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + cat.id).classList.add('active');
    });
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'cat-panel' + (idx === 0 ? ' active' : '');
    panel.id = 'panel-' + cat.id;
    panel.innerHTML = renderCategoryHtml(cat);
    panelsEl.appendChild(panel);
  });

  attachCatalogEvents();
}

function renderCategoryHtml(cat){
  const rowsHtml = cat.rows.map(r => {
    if(!editMode) return viewRowHtml(r);
    return r.locked ? lockedRowHtml(cat.id, r) : editRowHtml(cat.id, r);
  }).join('');
  const head = editMode
    ? `<tr><th class="col-level">과정</th><th class="col-desc">설명</th><th class="col-time">시간</th><th class="col-price">월 수강료</th><th class="col-del"></th></tr>`
    : `<tr><th class="col-level">과정</th><th class="col-desc">설명</th><th class="col-time">시간</th><th class="col-price">월 수강료</th></tr>`;
  return `
    <div class="cat-head"><h2 class="serif">${cat.name}</h2></div>
    <table class="fee"><thead>${head}</thead><tbody>${rowsHtml}</tbody></table>
    ${editMode ? `<button class="add-row-btn" data-add="${cat.id}">+ 과정 추가</button>` : ''}
  `;
}

function lockedRowHtml(catId, r){
  const price = formatPrice(r.price);
  return `
    <tr data-row="${r.id}" data-cat="${catId}" class="locked-row">
      <td><div class="level-cell"><span class="drag-handle" draggable="true">⠿</span><div class="view-name">🔒 ${escapeHtml(r.level)}</div></div></td>
      <td><div class="view-desc">${escapeHtml(r.desc)}</div></td>
      <td><div class="view-time">${escapeHtml(r.time)}</div></td>
      <td><div class="view-price">${price ? price : '-'}${price ? '<small>원</small>' : ''}</div></td>
      <td><button class="btn btn-sm unlock-row-btn" data-unlock="${r.id}" data-unlock-cat="${catId}">🔓</button></td>
    </tr>
  `;
}

function editRowHtml(catId, r){
  return `
    <tr data-row="${r.id}" data-cat="${catId}">
      <td><span class="drag-handle" draggable="true">⠿</span><input class="cell-input" data-field="level" value="${escapeAttr(r.level)}" placeholder="과정명"></td>
      <td><input class="cell-input" data-field="desc" value="${escapeAttr(r.desc)}" placeholder="설명"></td>
      <td><input class="cell-input" data-field="time" value="${escapeAttr(r.time)}" placeholder="예: 주2회 60분"></td>
      <td><input class="cell-input price-input" data-field="price" value="${escapeAttr(formatPrice(r.price))}" placeholder="금액"></td>
      <td>
        <button class="lock-row-btn" data-lock="${r.id}" data-lock-cat="${catId}" aria-label="잠그기" title="잠그기">🔒</button>
        <button class="del-btn" data-del="${r.id}" aria-label="삭제">✕</button>
      </td>
    </tr>
  `;
}

function viewRowHtml(r){
  const price = formatPrice(r.price);
  return `
    <tr>
      <td><div class="view-name">${escapeHtml(r.level)}</div></td>
      <td><div class="view-desc">${escapeHtml(r.desc)}</div></td>
      <td><div class="view-time">${escapeHtml(r.time)}</div></td>
      <td><div class="view-price">${price ? price : '-'}${price ? '<small>원</small>' : ''}</div></td>
    </tr>
  `;
}

function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function attachCatalogEvents(){
  if(!editMode) return;
  panelsEl.querySelectorAll('input.cell-input').forEach(input => {
    input.addEventListener('input', () => {
      const tr = input.closest('tr');
      const cat = state.categories.find(c => c.id === tr.dataset.cat);
      const row = cat.rows.find(r => r.id === tr.dataset.row);
      const field = input.dataset.field;
      if(field === 'price'){
        const digits = input.value.replace(/[^0-9]/g, '');
        row.price = digits;
        input.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      }else{
        row[field] = input.value;
      }
      if(field === 'price' || field === 'level') renderCourseOptions();
      renderCalculator();
      scheduleSave();
    });
  });
  panelsEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const rowId = btn.dataset.del;
      state.categories.forEach(cat => { cat.rows = cat.rows.filter(r => r.id !== rowId); });
      state.calculator.items = state.calculator.items.filter(i => i.courseId !== rowId);
      render();
      scheduleSave();
    });
  });
  panelsEl.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = state.categories.find(c => c.id === btn.dataset.add);
      cat.rows.push({ id: cid(), level: '', desc: '', time: '', price: '', locked: false });
      render();
      const activeTab = document.querySelector(`.tab-btn[data-cat="${btn.dataset.add}"]`);
      if(activeTab) activeTab.click();
      scheduleSave();
    });
  });
  const ROW_LOCK_PIN = '6589';
  panelsEl.querySelectorAll('.unlock-row-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = window.prompt('잠금 해제 비밀번호를 입력하세요');
      if(input === null) return;
      if(input !== ROW_LOCK_PIN){
        alert('비밀번호가 올바르지 않습니다.');
        return;
      }
      const cat = state.categories.find(c => c.id === btn.dataset.unlockCat);
      const row = cat.rows.find(r => r.id === btn.dataset.unlock);
      if(row) row.locked = false;
      render();
      const activeTab = document.querySelector(`.tab-btn[data-cat="${btn.dataset.unlockCat}"]`);
      if(activeTab) activeTab.click();
      scheduleSave();
    });
  });
  panelsEl.querySelectorAll('.lock-row-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = state.categories.find(c => c.id === btn.dataset.lockCat);
      const row = cat.rows.find(r => r.id === btn.dataset.lock);
      if(row) row.locked = true;
      render();
      const activeTab = document.querySelector(`.tab-btn[data-cat="${btn.dataset.lockCat}"]`);
      if(activeTab) activeTab.click();
      scheduleSave();
    });
  });

  panelsEl.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('dragstart', (e) => {
      const tr = handle.closest('tr');
      dragSource = { catId: tr.dataset.cat, rowId: tr.dataset.row };
      e.dataTransfer.effectAllowed = 'move';
    });
    handle.addEventListener('dragend', () => {
      panelsEl.querySelectorAll('tr.drag-over').forEach(tr => tr.classList.remove('drag-over'));
    });
  });
  panelsEl.querySelectorAll('table.fee tbody tr').forEach(tr => {
    tr.addEventListener('dragover', (e) => {
      if(!dragSource || dragSource.catId !== tr.dataset.cat) return;
      e.preventDefault();
      tr.classList.add('drag-over');
    });
    tr.addEventListener('dragleave', () => {
      tr.classList.remove('drag-over');
    });
    tr.addEventListener('drop', (e) => {
      e.preventDefault();
      tr.classList.remove('drag-over');
      if(!dragSource) return;
      const targetCatId = tr.dataset.cat;
      const targetRowId = tr.dataset.row;
      if(dragSource.catId !== targetCatId){ dragSource = null; return; }
      const cat = state.categories.find(c => c.id === targetCatId);
      const fromIdx = cat.rows.findIndex(r => r.id === dragSource.rowId);
      const toIdx = cat.rows.findIndex(r => r.id === targetRowId);
      dragSource = null;
      if(fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
      const [moved] = cat.rows.splice(fromIdx, 1);
      cat.rows.splice(toIdx, 0, moved);
      render();
      const activeTab = document.querySelector(`.tab-btn[data-cat="${targetCatId}"]`);
      if(activeTab) activeTab.click();
      scheduleSave();
    });
  });
}

function renderCourseOptions(){
  const options = ['<option value="">과정 선택…</option>'];
  state.categories.forEach(cat => {
    cat.rows.forEach(r => {
      if(!r.level) return;
      const priceLabel = r.price ? formatPrice(r.price) + '원' : '가격 미입력';
      options.push(`<option value="${r.id}">${escapeHtml(cat.name)} · ${escapeHtml(r.level)} (${priceLabel})</option>`);
    });
  });
  courseSelect.innerHTML = options.join('');
}

function getCalculatorSnapshot(){
  const items = state.calculator.items
    .map(item => {
      const found = findRowById(item.courseId);
      return found ? { item, row: found.row, cat: found.cat } : null;
    })
    .filter(Boolean);
  const total = items.reduce((sum, {row}) => sum + (parseFloat(String(row.price).replace(/[^0-9.]/g,'')) || 0), 0);
  const discount1 = parseFloat(String(state.calculator.discountAmount).replace(/[^0-9.]/g,'')) || 0;
  const discount2 = parseFloat(String(state.calculator.discountAmount2).replace(/[^0-9.]/g,'')) || 0;
  const discount = discount1 + discount2;
  const final = Math.max(total - discount, 0);
  const afterDiscount1 = Math.max(total - discount1, 0);
  const rate1 = items.length > 0 && total > 0 && discount1 > 0 ? Math.round((discount1 / total) * 100) : null;
  const rate2 = items.length > 0 && afterDiscount1 > 0 && discount2 > 0 ? Math.round((discount2 / afterDiscount1) * 100) : null;

  // 같은 과정을 여러 번 추가하면 등록 순서대로 1개월, 2개월, ... 라벨 부여
  const courseTotals = {};
  items.forEach(entry => {
    const cId = entry.item.courseId;
    courseTotals[cId] = (courseTotals[cId] || 0) + 1;
  });
  const courseSeen = {};
  items.forEach(entry => {
    const cId = entry.item.courseId;
    courseSeen[cId] = (courseSeen[cId] || 0) + 1;
    entry.monthLabel = courseTotals[cId] > 1 ? courseSeen[cId] : null;
  });

  // 할인 금액을 목록 맨 아래(가장 마지막에 추가한 과정)부터 원수강료에서 차감
  let remaining = discount;
  for(let i = items.length - 1; i >= 0; i--){
    const original = parseFloat(String(items[i].row.price).replace(/[^0-9.]/g,'')) || 0;
    const deducted = Math.min(remaining, original);
    items[i].originalPrice = original;
    items[i].deducted = deducted;
    items[i].adjustedPrice = original - deducted;
    remaining -= deducted;
  }

  return { items, total, discount1, discount2, discount, final, rate1, rate2, afterDiscount1 };
}

function renderCalculator(){
  const { items, total, discount1, discount2, discount, final, rate1, rate2 } = getCalculatorSnapshot();

  if(items.length === 0){
    selectedListEl.innerHTML = `<div class="selected-empty">${editMode ? '위에서 과정을 선택해 추가해주세요.' : '선택된 과정이 없습니다.'}</div>`;
  }else{
    selectedListEl.innerHTML = items.map(({item, row, cat, originalPrice, adjustedPrice, deducted, monthLabel}) => `
      <div class="selected-item">
        <div class="info"><b>${escapeHtml(row.level)}${monthLabel ? ` <span class="month-tag">${monthLabel}개월</span>` : ''}</b><span>${escapeHtml(cat.name)}${row.time ? ' · ' + escapeHtml(row.time) : ''}</span></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="price">${
            row.price
              ? (deducted > 0
                  ? `<s class="price-strike">${formatPrice(originalPrice)}원</s> ${formatPrice(adjustedPrice)}원/월`
                  : formatPrice(originalPrice) + '원/월')
              : '가격 미입력'
          }</span>
          <button class="remove-btn edit-only" data-remove-course="${item.instanceId}" aria-label="제거">✕</button>
        </div>
      </div>
    `).join('');
  }

  const hasCalc = items.length > 0;
  document.getElementById('calc-count').textContent = items.length + '과목';
  document.getElementById('calc-total').textContent = hasCalc ? formatPrice(total) + '원' : '-';
  document.getElementById('calc-discount').textContent = hasCalc && discount ? '-' + formatPrice(discount) + '원' : '-';
  document.getElementById('calc-final').textContent = hasCalc ? formatPrice(final) + '원' : '-';
  const labels = [];
  if(state.calculator.discountLabel) labels.push(state.calculator.discountLabel + (rate1 !== null ? `(${rate1}%)` : ''));
  if(state.calculator.discountLabel2) labels.push(state.calculator.discountLabel2 + (rate2 !== null ? `(${rate2}%)` : ''));
  document.getElementById('calc-discount-label-out').textContent = '할인' + (labels.length ? ' · ' + labels.join(' + ') : '');
  const rateInput1 = document.getElementById('calc-discount-rate');
  const rateInput2 = document.getElementById('calc-discount-rate2');
  if(document.activeElement !== rateInput1) rateInput1.value = rate1 !== null ? rate1 : '';
  if(document.activeElement !== rateInput2) rateInput2.value = rate2 !== null ? rate2 : '';

  const DEFAULT_RATE_PER_60MIN = 120000;
  const ACTING_GROUP_LEVELS = ['입문', '기초', '중급', '고급', '전문', '예고입시', '연기종합'];
  function getFeeRule(cat, row){
    if(cat.name === '연기' && ACTING_GROUP_LEVELS.includes(row.level)){
      return { rate: DEFAULT_RATE_PER_60MIN, divisor: 6 };
    }
    if(cat.name === '라이브커머스'){
      return { rate: 200000, divisor: 1 };
    }
    if(cat.name === '보컬' && row.level === '그룹'){
      return { rate: DEFAULT_RATE_PER_60MIN, divisor: 6 };
    }
    return { rate: DEFAULT_RATE_PER_60MIN, divisor: 1 };
  }
  let actualFeeTotal = 0;
  items.forEach(({row, cat}) => {
    const m = String(row.time || '').match(/(\d+)\s*분/);
    if(m){
      const minutes = parseInt(m[1], 10);
      const { rate, divisor } = getFeeRule(cat, row);
      actualFeeTotal += Math.round(((minutes / 60) * rate) / divisor);
    }
  });
  const pctOfTotal = hasCalc && final > 0 ? Math.round((actualFeeTotal / final) * 100) : 0;
  document.getElementById('breakdown-pct').textContent = hasCalc ? pctOfTotal + '%' : '-';
  const pctEl = document.getElementById('breakdown-pct');
  pctEl.classList.remove('pct-high', 'pct-low');
  if(hasCalc && pctOfTotal >= 40) pctEl.classList.add('pct-high');
  else if(hasCalc && pctOfTotal <= 20) pctEl.classList.add('pct-low');

  panelsAttachCalcRemoveEvents();
}

function panelsAttachCalcRemoveEvents(){
  if(!editMode) return;
  selectedListEl.querySelectorAll('[data-remove-course]').forEach(btn => {
    btn.addEventListener('click', () => {
      const instanceId = btn.dataset.removeCourse;
      state.calculator.items = state.calculator.items.filter(i => i.instanceId !== instanceId);
      renderCalculator();
      scheduleSave();
    });
  });
}

document.getElementById('course-add-btn').addEventListener('click', () => {

  state.calculator.items.push({ instanceId: cid(), courseId: id });
  renderCalculator();
  scheduleSave();
});

document.getElementById('calc-discount-label').addEventListener('input', (e) => {

  scheduleSave();
});
document.getElementById('calc-discount-amount').addEventListener('input', (e) => {

  renderCalculator();
  scheduleSave();
});
document.getElementById('calc-discount-label2').addEventListener('input', (e) => {
  state.calculator.discountLabel2 = e.target.value;
  renderCalculator();
  scheduleSave();
});
document.getElementById('calc-discount-amount2').addEventListener('input', (e) => {
  state.calculator.discountAmount2 = e.target.value;
  renderCalculator();
  scheduleSave();
});

function bindRateInput(rateId, amountKey, amountFieldId, getBase){
  document.getElementById(rateId).addEventListener('input', (e) => {
    const raw = e.target.value.replace(/[^0-9.]/g, '');
    const base = getBase();
    if(raw === ''){
      state.calculator[amountKey] = '';
    }else{
      const rateVal = parseFloat(raw);
      state.calculator[amountKey] = base > 0 && !isNaN(rateVal) ? String(Math.round(base * rateVal / 100)) : '';
    }
    document.getElementById(amountFieldId).value = state.calculator[amountKey];
    renderCalculator();
    scheduleSave();
  });
}
bindRateInput('calc-discount-rate', 'discountAmount', 'calc-discount-amount', () => getCalculatorSnapshot().total);
bindRateInput('calc-discount-rate2', 'discountAmount2', 'calc-discount-amount2', () => getCalculatorSnapshot().afterDiscount1);

modeToggle.addEventListener('click', () => {
  editMode = !editMode;
  modeToggle.textContent = editMode ? '편집 모드' : '학생용 보기';
  modeToggle.classList.toggle('on', editMode);
  render();
});

function preparePrintHeader(){
  const nameInput = document.getElementById('student-name');
  const nameEl = document.getElementById('print-header-name');
  nameEl.textContent = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '';
  document.getElementById('print-date').textContent = new Date().toLocaleDateString('ko-KR');
}

async function exportAsJpg(){
  const scrollY = window.scrollY;
  preparePrintHeader();
  document.body.classList.add('force-print-view');
  await new Promise(resolve => setTimeout(resolve, 60));
  try{
    const canvas = await html2canvas(document.getElementById('app-wrap'), {
      backgroundColor: '#ffffff',
      scale: 2,
      useCORS: true
    });
    const nameInput = document.getElementById('student-name');
    const namePart = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '수강료';
    const datePart = new Date().toISOString().slice(0, 10);
    const link = document.createElement('a');
    link.download = `${namePart}_${datePart}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  }catch(e){
    console.error(e);
    alert('이미지 저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
  }finally{
    document.body.classList.remove('force-print-view');
    window.scrollTo(0, scrollY);
  }
}

document.getElementById('print-btn').addEventListener('click', async () => {
  const warningEl = document.getElementById('print-warning');
  const nameInput = document.getElementById('student-name');

  if(!nameInput || !nameInput.value.trim()){
    warningEl.classList.add('show');
    return;
  }
  warningEl.classList.remove('show');

  preparePrintHeader();
  window.print();
  await exportAsJpg();
});

document.getElementById('student-name').addEventListener('input', (e) => {
  if(e.target.value.trim()) document.getElementById('print-warning').classList.remove('show');
});

function autoResizeTextarea(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function renderNotesDisplay(){
  const el = document.getElementById('notes-display');
  const lines = (state.notes || '').split('\n');
  el.innerHTML = lines.map(line => {
    const trimmed = line.trim();
    if(!trimmed) return '<div class="note-spacer"></div>';
    if(trimmed.startsWith('※')) return `<div class="note-heading">${escapeHtml(line)}</div>`;
    return `<div class="note-body">${escapeHtml(line)}</div>`;
  }).join('');
}

authorInput.addEventListener('input', () => {
  state.updatedBy = authorInput.value;
  scheduleSave();
});
notesInput.addEventListener('input', () => {
  state.notes = notesInput.value;
  autoResizeTextarea(notesInput);
  renderNotesDisplay();
  scheduleSave();
});

document.getElementById('refresh-btn').addEventListener('click', () => {
  loadData();
});

firebase.auth().onAuthStateChanged(user => {
  if(user){
    loadData();
  }
});
firebase.auth().signInAnonymously().catch(err => {
  console.error(err);
  setStatus('로그인 실패 — Firebase 설정을 확인해주세요', false);
});
</script>
</body>
</html>
